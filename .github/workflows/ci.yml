name: CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Docker
        run: docker build -t map-projet-app ./app

      - name: Lancer le conteneur
        run: docker run -d --name test-app -p 5000:5000 map-projet-app

      - name: Attendre que le conteneur démarre
        run: sleep 3

      - name: Tester le endpoint /
        run: curl --fail http://localhost:5000/

      - name: Arrêter le conteneur
        run: docker stop test-app

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Déployer sur la VM Oracle Cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd map-projet
            git pull origin main
            cd app
            docker build -t map-projet-app .
            docker stop map-projet-app || true
            docker rm map-projet-app || true
            docker run -d -p 5000:5000 --name map-projet-app map-projet-app
